<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FX Bench</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #hud { position: fixed; left: 8px; top: 8px; color: #8cf; font: 12px/1.35 ui-monospace, Menlo, monospace; pointer-events: none; white-space: pre; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<div id="hud"></div>
<script type="module">
// FX bench: dark wet street ring with neon, a box "car" circling with every emitter, rain + full post stack.
// URL params: speed=0..1  nitro=1  impact=1  type=all|smoke|spray|sparks|nitro|skids|none  rain=0..1
//             cam=chase|side|low|top|front  nofx=1  quality=low  hud=0  drift=0..1  pause=1
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { createPostFX } from '/src/fx/postfx.js';
import { createParticles } from '/src/fx/particles.js';
import { createRain } from '/src/fx/rain.js';
import { LAYERS } from '/src/config.js';

const P = new URLSearchParams(location.search);
const num = (k, d) => (P.has(k) ? parseFloat(P.get(k)) : d);
const SPEED = num('speed', 0.55);
const NITRO = P.get('nitro') === '1';
const IMPACT = P.get('impact') === '1';
const TYPE = P.get('type') || 'all';
const RAIN = num('rain', 1);
const CAM = P.get('cam') || 'chase';
const NOFX = P.get('nofx') === '1';
const QUALITY = P.get('quality') || 'high';
const DRIFT = num('drift', TYPE === 'smoke' || TYPE === 'skids' ? 1 : 0);
const has = (t) => TYPE === 'all' || TYPE === t;

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, QUALITY === 'low' ? 1 : 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.info.autoReset = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04050b);
scene.fog = new THREE.FogExp2(0x0b0c1a, 0.011);
const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, 0.1, 900);
camera.layers.enable(LAYERS.NO_REFLECTION); // particles + rain live there (hidden from the mirror, like in game)

// ---------- environment: neon city ring ----------
const RADIUS = 120;
const pmrem = new THREE.PMREMGenerator(renderer);
function buildEnvScene() {
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x020308);
  const cols = [0xff2a6d, 0x00e5ff, 0xb026ff, 0xffb000, 0x3d7bff];
  for (let i = 0; i < 40; i++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(2 + Math.random() * 6, 0.6 + Math.random() * 2, 0.2),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(cols[i % cols.length]).multiplyScalar(3 + Math.random() * 4) }));
    const a = Math.random() * Math.PI * 2;
    m.position.set(Math.cos(a) * 20, 1 + Math.random() * 10, Math.sin(a) * 20);
    m.lookAt(0, m.position.y, 0);
    s.add(m);
  }
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 0.75, 0.45).multiplyScalar(8) }));
  for (let i = 0; i < 8; i++) { const l = lamp.clone(); const a = i / 8 * Math.PI * 2; l.position.set(Math.cos(a) * 15, 9, Math.sin(a) * 15); s.add(l); }
  return s;
}
const envRT = pmrem.fromScene(buildEnvScene(), 0.02);
scene.environment = envRT.texture;
scene.environmentIntensity = 0.6;

// wet asphalt: dark, very glossy, normal-mapped puddle variation
function makeRoadTextures() {
  const n = 512;
  const c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  const img = g.createImageData(n, n);
  for (let i = 0; i < n * n; i++) {
    const v = 0.5 + (Math.random() - 0.5) * 0.25;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v * 255; img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  // puddles: dark blotches = low roughness
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * n, y = Math.random() * n, r = 10 + Math.random() * 60;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(10,10,10,0.9)'); gr.addColorStop(1, 'rgba(10,10,10,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(40, 40); t.colorSpace = THREE.NoColorSpace;
  return t;
}
const roughTex = makeRoadTextures();
// bench-only wet road: a planar mirror under a partially transparent asphalt layer (puddles = more mirror)
const mirror = new Reflector(new THREE.PlaneGeometry(700, 700), {
  textureWidth: Math.round(innerWidth * renderer.getPixelRatio() * 0.5),
  textureHeight: Math.round(innerHeight * renderer.getPixelRatio() * 0.5),
  color: 0x5a5a5a, multisample: 0,
});
mirror.rotation.x = -Math.PI / 2;
scene.add(mirror);
// like the game's wet-road reflection: the mirror camera skips the NO_REFLECTION layer (flames, sparks, rain...)
if (mirror.getReflectionCamera) mirror.getReflectionCamera(camera).layers.disable(LAYERS.NO_REFLECTION);
const puddleTex = (() => {
  const n = 256, c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  g.fillStyle = 'rgb(225,225,225)'; g.fillRect(0, 0, n, n);
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * n, y = Math.random() * n, r = 8 + Math.random() * 40;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(40,40,40,1)'); gr.addColorStop(0.7, 'rgba(60,60,60,0.8)'); gr.addColorStop(1, 'rgba(225,225,225,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30); t.colorSpace = THREE.NoColorSpace;
  return t;
})();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(700, 700),
  new THREE.MeshStandardMaterial({ color: 0x0b0c0f, roughness: 0.55, metalness: 0.0, roughnessMap: roughTex, alphaMap: puddleTex,
    transparent: true, opacity: 0.85, depthWrite: false, envMapIntensity: 0.4 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.002;
ground.renderOrder = -2;
scene.add(ground);

// lane lines along the ring
{
  const lines = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 0.5 });
  const geo = new THREE.PlaneGeometry(0.15, 3);
  const inst = new THREE.InstancedMesh(geo, mat, 260);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  for (let i = 0; i < 260; i++) {
    const a = (i / 260) * Math.PI * 2;
    e.set(-Math.PI / 2, 0, -a); q.setFromEuler(e);
    m.compose(new THREE.Vector3(Math.cos(a) * (RADIUS - 4), 0.005, Math.sin(a) * (RADIUS - 4)), q, new THREE.Vector3(1, 1, 1));
    inst.setMatrixAt(i, m);
  }
  lines.add(inst);
  scene.add(lines);
}

// neon signs + buildings + light strings on both sides of the ring
const neonCols = [0xff2a6d, 0x00e5ff, 0xb026ff, 0xffb000, 0x39ff88, 0x3d7bff];
{
  const bGeo = new THREE.BoxGeometry(1, 1, 1);
  const bMat = new THREE.MeshStandardMaterial({ color: 0x0b0c12, roughness: 0.8 });
  const N = 60;
  const bld = new THREE.InstancedMesh(bGeo, bMat, N * 2);
  const m = new THREE.Matrix4();
  let k = 0;
  for (let i = 0; i < N; i++) {
    for (const side of [-1, 1]) {
      const a = (i + (side > 0 ? 0.5 : 0)) / N * Math.PI * 2;
      const r = RADIUS + side * (16 + Math.random() * 4);
      const h = 10 + Math.random() * 35;
      m.makeRotationY(-a).setPosition(Math.cos(a) * r, h / 2, Math.sin(a) * r);
      m.scale(new THREE.Vector3(10, h, 8));
      bld.setMatrixAt(k++, m);
    }
  }
  scene.add(bld);
  // neon signs
  for (let i = 0; i < 46; i++) {
    const side = i % 2 ? 1 : -1;
    const a = (i / 46) * Math.PI * 2 + Math.random() * 0.05;
    const r = RADIUS + side * (11.5 + Math.random() * 1.5);
    const col = new THREE.Color(neonCols[i % neonCols.length]);
    const sign = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.5 + Math.random() * 2.5, 2 + Math.random() * 5),
      new THREE.MeshStandardMaterial({ color: 0x000000, emissive: col, emissiveIntensity: 5 + Math.random() * 6 }));
    sign.position.set(Math.cos(a) * r, 3 + Math.random() * 7, Math.sin(a) * r);
    sign.rotation.y = -a;
    scene.add(sign);
  }
  // street lamps (emissive heads + light strings)
  const lampGeo = new THREE.SphereGeometry(0.35, 12, 8);
  const lampMat = new THREE.MeshStandardMaterial({ color: 0, emissive: new THREE.Color(1, 0.72, 0.42), emissiveIntensity: 18 });
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x15161a, roughness: 0.5, metalness: 0.8 });
  const poleGeo = new THREE.CylinderGeometry(0.08, 0.1, 7, 6);
  for (let i = 0; i < 40; i++) {
    const side = i % 2 ? 1 : -1;
    const a = (i / 40) * Math.PI * 2;
    const r = RADIUS + side * 9.5;
    const lamp = new THREE.Mesh(lampGeo, lampMat);
    lamp.position.set(Math.cos(a) * r, 7, Math.sin(a) * r);
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.set(Math.cos(a) * r, 3.5, Math.sin(a) * r);
    scene.add(lamp, pole);
  }
  // fairy-light strings across the road
  const bulbGeo = new THREE.SphereGeometry(0.07, 6, 4);
  const bulbs = new THREE.InstancedMesh(bulbGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }), 12 * 30);
  let bi = 0;
  const c = new THREE.Color();
  for (let s = 0; s < 12; s++) {
    const a = (s / 12) * Math.PI * 2 + 0.13;
    for (let j = 0; j < 30; j++) {
      const t = j / 29;
      const r = RADIUS - 10 + t * 20;
      const y = 8.5 - Math.sin(t * Math.PI) * 1.6;
      m.makeTranslation(Math.cos(a) * r, y, Math.sin(a) * r);
      bulbs.setMatrixAt(bi, m);
      c.set(neonCols[(s + j) % neonCols.length]).multiplyScalar(6);
      bulbs.setColorAt(bi, c);
      bi++;
    }
  }
  scene.add(bulbs);
}
scene.add(new THREE.HemisphereLight(0x223355, 0x050508, 0.35));
const lampLights = [0, 1, 2, 3].map(() => { const l = new THREE.PointLight(0xffb070, 60, 26, 1.6); scene.add(l); return l; });
function placeLampLights(angle) {
  const step = (Math.PI * 2) / 40;
  const base = Math.round(angle / step);
  lampLights.forEach((l, j) => {
    const i = base + j - 1;
    const side = ((i % 2) + 2) % 2 ? 1 : -1;
    const a = i * step;
    l.position.set(Math.cos(a) * (RADIUS + side * 9.5), 6.6, Math.sin(a) * (RADIUS + side * 9.5));
  });
}
const moon = new THREE.DirectionalLight(0x8090ff, 0.25);
moon.position.set(30, 60, 10);
scene.add(moon);

// ---------- the "car" ----------
const car = new THREE.Group();
{
  const paint = new THREE.MeshPhysicalMaterial({ color: 0x0a3cff, metalness: 0.6, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.05 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.62, 4.5), paint);
  body.position.y = 0.55;
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.48, 2.0), new THREE.MeshPhysicalMaterial({ color: 0x050608, roughness: 0.05, metalness: 0.2 }));
  cabin.position.set(0, 1.08, -0.25);
  const tail = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.07, 0.05), new THREE.MeshStandardMaterial({ color: 0, emissive: 0xff0018, emissiveIntensity: 12 }));
  tail.position.set(0, 0.78, -2.27);
  const headL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.05), new THREE.MeshStandardMaterial({ color: 0, emissive: 0xdde8ff, emissiveIntensity: 14 }));
  const headR = headL.clone();
  headL.position.set(0.6, 0.72, 2.27); headR.position.set(-0.6, 0.72, 2.27);
  const wGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.28, 18).rotateZ(Math.PI / 2);
  const wMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });
  for (const [x, z] of [[0.83, 1.35], [-0.83, 1.35], [0.83, -1.35], [-0.83, -1.35]]) {
    const w = new THREE.Mesh(wGeo, wMat); w.position.set(x, 0.35, z); car.add(w);
  }
  car.add(body, cabin, tail, headL, headR);
  const spot = new THREE.SpotLight(0xdde8ff, 300, 70, 0.5, 0.5, 1.5);
  spot.position.set(0, 0.8, 2.3);
  spot.target.position.set(0, 0, 14);
  car.add(spot, spot.target);
}
scene.add(car);

// ---------- FX ----------
const postfx = createPostFX({ renderer, scene, camera, quality: QUALITY });
const particles = createParticles({ scene, quality: QUALITY });
const rain = createRain({ scene, quality: QUALITY });
rain.setIntensity(RAIN);

const wheelLocal = { fl: new THREE.Vector3(0.83, 0, 1.35), fr: new THREE.Vector3(-0.83, 0, 1.35), rl: new THREE.Vector3(0.83, 0, -1.35), rr: new THREE.Vector3(-0.83, 0, -1.35) };
const exhaustLocal = [new THREE.Vector3(0.45, 0.32, -2.3), new THREE.Vector3(-0.45, 0.32, -2.3)];

// ---------- sim ----------
const speedMs = SPEED * 89; // 0..~320 km/h
let angle = 0.3;
let time = 0;
let paused = P.get('pause') === '1';
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), vel = new THREE.Vector3();
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
const camTarget = new THREE.Vector3(), camPos = new THREE.Vector3();
let lastImpact = -10;

function step(dt) {
  time += dt;
  const omega = speedMs / RADIUS; // clockwise on the ring (seen from above) → turning right
  angle += omega * dt;
  // position on ring (radius slightly inside so neon is on both sides)
  const x = Math.cos(angle) * RADIUS, z = Math.sin(angle) * RADIUS;
  // direction of travel = d/dangle
  const tx = -Math.sin(angle), tz = Math.cos(angle);
  const heading = Math.atan2(tx, tz) + DRIFT * 0.45 * Math.sign(omega || 1) * -1;
  car.position.set(x, 0, z);
  placeLampLights(angle);
  car.rotation.y = heading;
  fwd.set(Math.sin(heading), 0, Math.cos(heading));
  right.set(-Math.cos(heading), 0, Math.sin(heading));
  vel.set(tx, 0, tz).multiplyScalar(speedMs);

  const wheelWorld = (k, out) => out.copy(wheelLocal[k]).applyQuaternion(car.quaternion).add(car.position);
  if (has('spray') && speedMs > 1) {
    for (const k of ['rl', 'rr']) particles.emitSpray(wheelWorld(k, tmp), vel, 1);
    for (const k of ['fl', 'fr']) particles.emitSpray(wheelWorld(k, tmp), vel, 0.35);
  }
  if (has('smoke') && DRIFT > 0) {
    for (const k of ['rl', 'rr']) particles.emitSmoke(wheelWorld(k, tmp), vel, DRIFT);
  }
  if (has('skids')) {
    const sk = DRIFT > 0 ? 0.9 : 0.5 + 0.5 * Math.sin(time * 1.3);
    for (const k of ['fl', 'fr', 'rl', 'rr']) particles.addSkidMark('0-' + k, wheelWorld(k, tmp), right, k[0] === 'r' ? sk : sk * 0.6);
  }
  if (has('sparks')) {
    // scraping a wall on the car's left side, normal points to the car's right
    tmp.set(0.98, 0.35, 0.6 + Math.sin(time * 3) * 0.8).applyQuaternion(car.quaternion).add(car.position);
    tmp2.copy(right);
    particles.emitSparks(tmp, tmp2, 0.8, vel);
  }
  if (has('nitro') || NITRO) {
    for (const e of exhaustLocal) {
      tmp.copy(e).applyQuaternion(car.quaternion).add(car.position);
      tmp2.copy(fwd).multiplyScalar(-1);
      particles.emitNitroFlame(tmp, tmp2, 1);
    }
  }
  if (IMPACT && time - lastImpact > 2.0) { lastImpact = time; postfx.set({ impact: 1 }); if (TYPE === 'all' || TYPE === 'sparks') particles.emitSparks(tmp.set(0.98, 0.5, 2).applyQuaternion(car.quaternion).add(car.position), right, 1.5, vel); }

  // camera
  if (CAM === 'chase') {
    // chase cams follow the travel direction, not the drifting body
    camPos.copy(car.position).addScaledVector(tmp2.set(tx, 0, tz), -6.4).add(tmp.set(0, 2.05, 0));
    camTarget.copy(car.position).addScaledVector(tmp2.set(tx, 0, tz), 5).add(tmp.set(0, 0.9, 0));
    camera.fov = 62 + SPEED * 18 + (NITRO ? 6 : 0);
  } else if (CAM === 'side') {
    camPos.copy(car.position).addScaledVector(right, 6).addScaledVector(fwd, -1).add(tmp.set(0, 1.3, 0));
    camTarget.copy(car.position).add(tmp.set(0, 0.6, 0)).addScaledVector(fwd, -1.5);
    camera.fov = 55;
  } else if (CAM === 'low') {
    camPos.copy(car.position).addScaledVector(fwd, -14).addScaledVector(right, -2.5).add(tmp.set(0, 0.5, 0));
    camTarget.copy(car.position).add(tmp.set(0, 0.6, 0));
    camera.fov = 50;
  } else if (CAM === 'front') {
    camPos.copy(car.position).addScaledVector(fwd, 9).addScaledVector(right, 2).add(tmp.set(0, 1.2, 0));
    camTarget.copy(car.position).add(tmp.set(0, 0.6, 0));
    camera.fov = 55;
  } else if (CAM === 'top') {
    camPos.copy(car.position).addScaledVector(fwd, -6).add(tmp.set(0, 14, 0));
    camTarget.copy(car.position).addScaledVector(fwd, 3);
    camera.fov = 60;
  }
  camera.position.copy(camPos);
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();

  rain.setHeadlights(tmp.copy(car.position).addScaledVector(fwd, 2.2).setY(0.75), fwd, true);
  postfx.set({ speed: SPEED * 0.98, nitro: NITRO ? 1 : 0 });
}

const hud = document.getElementById('hud');
if (P.get('hud') === '0') hud.style.display = 'none';
let last = performance.now();
let frames = 0, fpsT = 0, fps = 0;
const stats = { calls: 0, triangles: 0 };
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (paused) dt = 0;
  step(dt);
  particles.update(dt, camera);
  rain.update(dt, camera, vel);
  renderer.info.reset();
  if (NOFX) renderer.render(scene, camera); else postfx.render(dt);
  stats.calls = renderer.info.render.calls;
  stats.triangles = renderer.info.render.triangles;
  frames++; fpsT += dt;
  if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0;
    const ps = particles.stats();
    hud.textContent = `fps ${fps.toFixed(0)}  calls ${stats.calls}  tris ${stats.triangles}\n` +
      `type=${TYPE} speed=${SPEED} nitro=${NITRO} rain=${RAIN}\nparticles ${JSON.stringify(ps)}`;
  }
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  postfx.setSize(innerWidth, innerHeight);
});
addEventListener('keydown', (e) => { if (e.code === 'KeyP') paused = !paused; });

// per-part draw-call breakdown (renders extra frames; for measurement only)
function breakdown() {
  const vis = (o, v) => (o.visible = v);
  const parts = { particles: particles.group, rain: rain.group };
  const measure = (fn) => { renderer.info.reset(); fn(); return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; };
  const pv = particles.group.visible, rv = rain.group.visible;
  vis(parts.particles, false); vis(parts.rain, false);
  const base = measure(() => renderer.render(scene, camera));
  vis(parts.particles, pv);
  const withP = measure(() => renderer.render(scene, camera));
  vis(parts.rain, rv);
  const withPR = measure(() => renderer.render(scene, camera));
  const full = measure(() => postfx.render(0));
  return {
    scene: base, particles: { calls: withP.calls - base.calls, tris: withP.tris - base.tris, detail: particles.stats() },
    rain: { calls: withPR.calls - withP.calls, tris: withPR.tris - withP.tris },
    postfx: { calls: full.calls - withPR.calls }, total: full,
  };
}
window.__fx = { renderer, scene, camera, postfx, particles, rain, stats, breakdown, setPaused: (v) => (paused = v) };
</script>
</body>
</html>
